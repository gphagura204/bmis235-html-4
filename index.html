<!-- JavaScript: flies the plane along the route and shows city info when a pin is clicked -->
<script>
  (function () {
    var wrap = document.querySelector('.sc-wrap');
    if (!wrap) return;

    var cities = {
      ny: { name: 'New York', pop: 'About 8.3 million people', known: 'Known for: Statue of Liberty, Times Square' },
      london: { name: 'London', pop: 'About 8.9 million people', known: 'Known for: Big Ben, Tower Bridge' },
      tokyo: { name: 'Tokyo', pop: 'About 14 million people', known: 'Known for: Shibuya Crossing, Tokyo Skytree' }
    };

    var info = wrap.querySelector('.sc-info');
    var pins = wrap.querySelectorAll('.sc-pin');

    function show(key, pin) {
      var c = cities[key];
      info.innerHTML =
        '<div class="sc-name">' + c.name + '</div>' +
        '<div class="sc-line">Population: ' + c.pop + '</div>' +
        '<div class="sc-line">' + c.known + '</div>';
      for (var i = 0; i < pins.length; i++) pins[i].classList.remove('sc-active');
      pin.classList.add('sc-active');
    }

    pins.forEach(function (pin) {
      pin.addEventListener('click', function () { show(pin.getAttribute('data-city'), pin); });
      pin.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          show(pin.getAttribute('data-city'), pin);
        }
      });
    });

    var route = wrap.querySelector('#scRoute');
    var plane = wrap.querySelector('#scPlane');
    var len = route.getTotalLength();
    var duration = 14000;

    function fly(t) {
      var d = ((t % duration) / duration) * len;
      var p = route.getPointAtLength(d);
      var q = route.getPointAtLength((d + 2) % len);
      var angle = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
      plane.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ') rotate(' + angle + ')');
      requestAnimationFrame(fly);
    }
    requestAnimationFrame(fly);
  })();
</script></div>
